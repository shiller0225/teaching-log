<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="教學進度">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>教學進度記錄表</title>
<style>
:root{
  --bg:#0f1419; --card:#1a2129; --card2:#222b35; --line:#33404d;
  --text:#f2f5f8; --muted:#9fb0c0; --accent:#ffc940; --accent-ink:#1a1400;
  --g1:#4fc3f7; --g2:#81c784; --g3:#ff8a65; --danger:#ff6b6b;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:20px;line-height:1.5}
body{padding:env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom))}
.wrap{max-width:820px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 16px}
header h1{font-size:28px;margin:0;letter-spacing:1px}
header .today{color:var(--muted);font-size:18px}

/* 表單 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
label.lbl{display:block;font-size:20px;font-weight:700;color:var(--accent);margin:0 0 10px}
.field{margin-bottom:22px}
.field:last-child{margin-bottom:0}
input[type=date],textarea{width:100%;font:inherit;font-size:22px;color:var(--text);
  background:var(--card2);border:2px solid var(--line);border-radius:12px;padding:14px 16px;outline:none}
input[type=date]{min-height:60px;color-scheme:dark;-webkit-appearance:none;appearance:none;display:block;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus{border-color:var(--accent)}
.chips{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}
.chips.two{grid-template-columns:repeat(2,1fr)}
.chip{font:inherit;font-size:22px;font-weight:700;min-height:64px;border-radius:12px;
  border:2px solid var(--line);background:var(--card2);color:var(--text);cursor:pointer;padding:8px}
.chip.on{border-color:transparent;color:#0b0f13}
.chip.on[data-g="1"]{background:var(--g1)} .chip.on[data-g="2"]{background:var(--g2)} .chip.on[data-g="3"]{background:var(--g3)}
.subj .chip.on{background:var(--accent);color:var(--accent-ink)}
.hint{font-size:18px;color:var(--muted);margin-top:8px}
.last{background:#14202b;border-left:5px solid var(--g1);border-radius:10px;padding:12px 14px;font-size:18px;color:#cfe3f2;margin-top:12px;display:none}
.last b{color:var(--text)}
.btn{font:inherit;font-size:24px;font-weight:800;width:100%;min-height:68px;border:none;border-radius:14px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--card2);color:var(--text);border:2px solid var(--line);font-size:20px;min-height:58px}
.btn.danger{background:transparent;color:var(--danger);border:2px solid var(--danger);font-size:20px;min-height:58px}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* 列表 */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.filters .chip{flex:0 0 auto;min-height:52px;font-size:19px;padding:6px 16px}
.filters .chip.on{background:var(--accent);color:var(--accent-ink)}
.rec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;border-left:8px solid var(--line)}
.rec[data-g="1"]{border-left-color:var(--g1)} .rec[data-g="2"]{border-left-color:var(--g2)} .rec[data-g="3"]{border-left-color:var(--g3)}
.rec .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rec .date{font-size:22px;font-weight:800}
.tag{font-size:17px;font-weight:700;padding:3px 10px;border-radius:8px;background:var(--card2);border:1px solid var(--line)}
.rec .k{color:var(--accent);font-weight:700;font-size:17px;margin-top:10px}
.rec .v{font-size:21px;white-space:pre-wrap;word-break:break-word}
.rec .acts{display:flex;gap:10px;margin-top:12px}
.rec .acts button{flex:1;font:inherit;font-size:18px;min-height:48px;border-radius:10px;background:var(--card2);color:var(--text);border:1px solid var(--line)}
.rec .acts .del{color:var(--danger);border-color:#5a2a2a}
.empty{text-align:center;color:var(--muted);padding:48px 12px;font-size:20px}
.count{color:var(--muted);font-size:18px;margin:0 4px 10px}

/* 底部導覽 */
nav{position:fixed;left:0;right:0;bottom:0;background:#0b0f13;border-top:1px solid var(--line);
  display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;font:inherit;font-size:19px;font-weight:700;color:var(--muted);background:none;border:none;
  min-height:64px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button .ic{font-size:26px;line-height:1}
nav button.on{color:var(--accent);background:#1a2129}
.page{display:none}.page.on{display:block}

.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);
  font-weight:800;font-size:20px;padding:14px 26px;border-radius:30px;opacity:0;pointer-events:none;transition:.25s;z-index:20}
.toast.show{opacity:1}
.editing-bar{display:none;background:#3a2f0a;color:var(--accent);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-weight:700}
.editing .editing-bar{display:block}
.install{background:#14202b;border:2px solid var(--g1);border-radius:14px;padding:14px 16px;margin-bottom:16px;display:none}
.install .t{font-weight:800;font-size:21px;color:var(--g1);margin-bottom:6px}
.install .d{font-size:19px;line-height:1.6}
.install .row{margin-top:12px}
.install button{font:inherit;font-size:20px;font-weight:800;min-height:56px;border-radius:12px;border:none;cursor:pointer}
.install .go{background:var(--g1);color:#0b0f13}
.install .no{background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.stuwrap{margin-top:14px;display:none}
.stuwrap .sub{font-size:19px;font-weight:800;color:var(--text);margin:4px 0 8px}
.grp{background:var(--card2);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.grp summary{list-style:none;cursor:pointer;padding:14px 16px;font-size:20px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.grp summary::-webkit-details-marker{display:none}
.grp summary .cnt{font-size:17px;font-weight:700;color:var(--muted);white-space:nowrap;margin-left:8px}
.grp summary .cnt.has{color:var(--accent)}
.stu{border-top:1px solid var(--line)}
.stu .head{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;min-height:60px}
.stu .nm{flex:1;font-size:21px;font-weight:700;min-width:0}
.stu .nm small{display:block;font-size:15px;color:var(--muted);font-weight:400}
.stu .pill{flex:0 1 auto;max-width:58%;font-size:17px;font-weight:700;padding:8px 12px;border-radius:10px;background:#141a21;border:2px solid var(--line);color:var(--muted);text-align:right;line-height:1.35}
.stu .pill::after{content:" ▾"}
.stu.open .pill::after{content:" ▴"}
.stu.mark{background:#2a2410}
.stu.mark .pill{border-color:var(--accent);color:var(--accent)}
.stu .opts{display:none;padding:4px 14px 14px}
.stu.open .opts{display:block}
.stu .og{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stu .ob{font:inherit;font-size:19px;font-weight:700;min-height:54px;white-space:nowrap;border-radius:10px;border:2px solid var(--line);background:#141a21;color:var(--text);cursor:pointer;padding:4px}
.stu .ob.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.stu .ob.on::before{content:"✔ "}
.stu .ob.wide{grid-column:1/-1}
.stu .extra{display:none;margin-top:10px;align-items:center;gap:10px;font-size:19px;font-weight:700}
.stu .extra.show{display:flex}
.stu .extra input{font:inherit;font-size:20px;color:var(--text);background:#141a21;border:2px solid var(--accent);border-radius:10px;padding:10px 12px;outline:none}
.stu .extra input.min{width:96px;text-align:center}
.stu .extra input.note{flex:1;min-width:0}
.stu .done{font:inherit;font-size:17px;margin-top:10px;width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--muted)}
.gprog .stuin{margin-top:12px}
.runits{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.runits .chip{min-height:56px;font-size:18px}
.runits .chip.on{background:var(--accent);color:var(--accent-ink)}
.nostu{font-size:18px;color:var(--muted);background:var(--card2);border-radius:10px;padding:12px 14px}
textarea.roster{min-height:160px;font-size:18px;margin-top:12px;display:none}
.remind{background:#3a2f0a;color:var(--accent);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-weight:700;display:none}
.tabbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 12px;margin-bottom:4px}
.tabbar.hide{display:none}
.gtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.stabs:empty{display:none}
.stab{font:inherit;font-size:21px;font-weight:800;min-height:56px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.stab.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.gtab{font:inherit;font-size:22px;font-weight:800;min-height:62px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.gtab.on{color:#0b0f13;border-color:transparent}
.gtab.on[data-g="1"]{background:var(--g1)} .gtab.on[data-g="2"]{background:var(--g2)} .gtab.on[data-g="3"]{background:var(--g3)}
.gprog{background:var(--card2);border:1px solid var(--line);border-left:6px solid var(--g3);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.gprog .gt{font-size:20px;font-weight:800;margin-bottom:8px}
.gprog textarea{min-height:96px;background:#141a21}
.gprog .gl{font-size:17px;color:#cfe3f2;margin-top:8px}
.gprog .gl b{color:var(--text)}
.gprog .sl{font-size:17px;font-weight:700;color:var(--accent);margin:10px 0 6px}
.gprog .sl:first-of-type{margin-top:0}
.gprog[data-c="1"]{border-left-color:var(--g1)}
@media (min-width:700px){ html,body{font-size:21px} .wrap{padding:24px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📘 教學進度</h1>
    <div class="today" id="todayLbl"></div>
  </header>
  <div class="tabbar" id="tabbar"><div class="gtabs" id="gtabs"></div><div class="stabs" id="stabs"></div></div>

  <!-- 記錄頁 -->
  <section class="page on" id="pg-add">
    <div class="install" id="installBox">
      <div class="t" id="instT"></div>
      <div class="d" id="instD"></div>
      <div class="row"><button class="go" id="instGo" style="display:none">📲 安裝到主畫面</button><button class="no" id="instNo">不再顯示</button></div>
    </div>
    <div class="editing-bar">✏️ 正在修改一筆舊記錄</div>
    <div class="card">
      <div class="field">
        <label class="lbl" for="fDate">日期</label>
        <input type="date" id="fDate">
      </div>
      <div class="field subj">
        <label class="lbl" id="subjLbl">科目</label>
        <div class="chips two" id="subjChips"></div>
        <div class="last" id="lastBox"></div>
      </div>
      <div class="field">
        <label class="lbl" for="fProg" id="progLbl">進度</label>
        <textarea id="fProg" placeholder="例：3-2 酸鹼中和，完成課本 p.68–72"></textarea>
        <div id="gProgBox"></div>
      </div>
      <div class="field" id="perfField">
        <label class="lbl" for="fPerf">課堂表現</label>
        <textarea id="fPerf" placeholder="例：專注度佳；實驗操作需再練習"></textarea>
        <div class="stuwrap" id="stuWrap">
          <div class="sub">👥 學生狀況（未選＝正常）</div>
          <div id="stuBox"></div>
        </div>
      </div>
    </div>
    <button class="btn primary" id="saveBtn">💾 儲存記錄</button>
    <div style="height:10px"></div>
    <button class="btn ghost" id="cancelEdit" style="display:none">取消修改</button>
  </section>

  <!-- 歷史頁 -->
  <section class="page" id="pg-list">
    <div class="filters" id="filters"></div>
    <div class="count" id="countLbl"></div>
    <div id="list"></div>
  </section>

  <!-- 資料頁 -->
  <section class="page" id="pg-data">
    <div class="remind" id="backupRemind"></div>
    <div class="card">
      <label class="lbl">匯出 Excel</label>
      <div class="hint" style="margin:0 0 14px">每個「年級＋科目」各一個工作表；分組的科目（一年級自然探究、三年級）依組別分欄，另有學生狀況統計。</div>
      <button class="btn primary" id="exportXlsx">📊 匯出 Excel 檔</button>
    </div>
    <div class="card">
      <label class="lbl">學生名單</label>
      <div class="runits" id="rUnits"></div>
      <div class="hint" style="margin:0 0 14px" id="rosterInfo"></div>
      <div class="row">
        <button class="btn ghost" id="rosterFileBtn">📄 匯入名單檔</button>
        <button class="btn ghost" id="rosterPasteBtn">📋 貼上名單</button>
      </div>
      <input type="file" id="rosterFile" accept=".csv,.txt,text/csv,text/plain" hidden>
      <textarea class="roster" id="rosterText" placeholder="每行一位：組別,班級座號,姓名&#10;例：A,30101,王小明&#10;（沒有分組可省略組別：30101,王小明）"></textarea>
      <div class="row" id="rosterPasteRow" style="display:none;margin-top:10px">
        <button class="btn primary" id="rosterPasteOk" style="font-size:20px;min-height:58px">✅ 套用名單</button>
      </div>
      <div style="height:10px"></div>
      <button class="btn danger" id="rosterClear" style="display:none">清除名單</button>
    </div>
    <div class="card">
      <label class="lbl">備份與還原</label>
      <div class="hint" style="margin:0 0 14px">資料只存在這台裝置的瀏覽器裡。建議每月備份一次，換手機或清除瀏覽器資料前務必備份。</div>
      <div class="row">
        <button class="btn ghost" id="backupBtn">⬇️ 備份</button>
        <button class="btn ghost" id="restoreBtn">⬆️ 還原</button>
      </div>
      <input type="file" id="restoreFile" accept=".json,application/json" hidden>
    </div>
    <div class="card">
      <label class="lbl">統計</label>
      <div id="stats" class="v" style="font-size:20px"></div>
    </div>
    <button class="btn danger" id="wipeBtn">🗑 清除全部資料</button>
    <div class="hint" style="text-align:center;margin-top:18px">教學進度記錄表 v1.8</div>
  </section>
</div>

<nav>
  <button data-pg="pg-add" class="on"><span class="ic">✍️</span>記錄</button>
  <button data-pg="pg-list"><span class="ic">📋</span>歷史</button>
  <button data-pg="pg-data"><span class="ic">📊</span>匯出／名單</button>
</nav>
<div class="toast" id="toast"></div>

<script src="xlsx.full.min.js" defer></script>
<script>
const SUBJECTS = {
  "一年級": ["自然探究","自然閱讀"],
  "二年級": ["雄科特訓班"],
  "三年級": ["理化","地球科學"]
};
const GRADES = Object.keys(SUBJECTS);
const GNUM = {"一年級":1,"二年級":2,"三年級":3};
const KEY = "teachingLog.v1";
const G3 = "三年級";
const PAGED = {"一年級":true};        // 科目分成獨立子頁的年級
const DEFAULT_GROUPS = ["B","E","F"];
const STATUSES = ["精神不佳","教材未帶","上課分心","身體不適","作業未完成","上課遲到","其他"];
const LATE="上課遲到";
const RKEY = KEY+".roster", RSKEY = KEY+".rosters", GKEY = KEY+".grade", SKEY = KEY+".subj";
const $ = s => document.querySelector(s);

let records = load();
// 舊名稱轉換：自然實驗 → 自然探究
if(records.some(r=>r.grade==="一年級"&&r.subject==="自然實驗")){ records.forEach(r=>{ if(r.grade==="一年級"&&r.subject==="自然實驗") r.subject="自然探究"; }); save(); }
/* 各班別名單：三年級共用一份；其他年級依科目各一份 */
const UNITS = [["三年級","三年級（理化／地科）"],["一年級|自然探究","一年級 自然探究"],["一年級|自然閱讀","一年級 自然閱讀"],["二年級|雄科特訓班","二年級 雄科特訓班"]];
let rosters = (()=>{ let o={}; try{ o=JSON.parse(localStorage.getItem(RSKEY))||{}; }catch(e){}
  if(!o["三年級"]){ try{ const old=JSON.parse(localStorage.getItem(RKEY)); if(Array.isArray(old)&&old.length) o["三年級"]=old; }catch(e){} }
  return o; })();
function unitOf(g,s){ return g===G3 ? "三年級" : g+"|"+s; }
function rosterOf(g,s){ return rosters[unitOf(g,s)]||[]; }
// 舊資料：學生狀況由單選字串改為陣列
{ let ch=false; for(const r of records) for(const x of (r.students||[])) if(!Array.isArray(x.s)){ x.s=x.s?[x.s]:[]; ch=true; } if(ch) save(); }
let grade = GRADES.includes(localStorage.getItem(GKEY)) ? localStorage.getItem(GKEY) : GRADES[0];
const curSubj = (()=>{ let o={}; try{ o=JSON.parse(localStorage.getItem(SKEY))||{}; }catch(e){}
  for(const g in PAGED) if(!SUBJECTS[g].includes(o[g])) o[g]=SUBJECTS[g][0]; return o; })();
let curPage = "pg-add";
let editingId = null;
let subjFilter = {};
const drafts = {};

/* 分組設定：哪些「年級＋科目」要分組填寫 */
function gcfg(g,s){
  if(g===G3){ const ro=rosters["三年級"]||[]; return {groups:()=> ro.length ? [...new Set(ro.map(x=>x.g))].sort() : DEFAULT_GROUPS, perf:false, stu:true}; }
  if(g==="一年級" && s==="自然探究") return {groups:()=>["週一B組","週四A組"], perf:true, stu:false};
  return null;
}
function groupList(cfg,...objs){
  const out=[...cfg.groups()];
  for(const o of objs) for(const k of Object.keys(o||{})) if(!out.includes(k)) out.push(k);
  return out;
}
function dkey(){ return PAGED[grade] ? grade+"|"+curSubj[grade] : grade; }
function blankDraft(g,s){ return {subject: s || (SUBJECTS[g].length===1 ? SUBJECTS[g][0] : null), prog:"", perf:"", gp:{}, gperf:{}, students:[]}; }
function D(){ const k=dkey(); return drafts[k] || (drafts[k]=blankDraft(grade, PAGED[grade]?curSubj[grade]:null)); }
function resetD(keepSubject){ const k=dkey(), s=keepSubject?D().subject:null; drafts[k]=blankDraft(grade, PAGED[grade]?curSubj[grade]:s); }

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; } }
function save(){ localStorage.setItem(KEY, JSON.stringify(records)); }
function saveRosters(){ localStorage.setItem(RSKEY, JSON.stringify(rosters)); }
function todayStr(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function fmtDate(s){ const d=new Date(s+"T00:00"); const w="日一二三四五六"[d.getDay()]; return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}（${w}）`; }
function shortDate(s){ return s.slice(5).replace("-","/"); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }
function sorted(arr){ return [...arr].sort((a,b)=> b.date.localeCompare(a.date) || b.created-a.created); }
function parseRoster(text){
  // 支援：組別,班級座號,姓名／班級座號,姓名／組別,原班,姓名／班級,姓名（沒有座號時以「班級＋姓名」辨識）
  const out=[]; let clsMode=null;
  for(let line of text.replace(/^﻿/,"").split(/\r?\n/)){
    line=line.trim(); if(!line) continue;
    const c=line.split(/[,\t，]/).map(x=>x.trim().replace(/^"|"$/g,""));
    const j=c.join("");
    if(/組別|座號|姓名|原班|班級/.test(j) && !/\d{3,}/.test(j)){ clsMode=/原班|班級/.test(j)&&!/座號/.test(j); continue; }
    let g="", code, name;
    if(c.length>=3){ g=c[0].toUpperCase(); code=c[1]; name=c[2]; }
    else if(c.length===2 && c[0] && c[1]){ code=c[0]; name=c[1]; }
    else continue;
    const isCls = clsMode===true || (clsMode===null && /^\d{3}$/.test(code));
    out.push(isCls ? {g, id:`${code}-${name}`, cls:code, name} : {g, id:code, name});
  }
  return out;
}
function groupsOf(list){ const m={}; for(const s of list){ (m[s.g||""]=m[s.g||""]||[]).push(s); } return Object.keys(m).sort().map(g=>({g,list:m[g]})); }
function gName(k){ return k.startsWith("（") ? k.replace(/[（）]/g,"") : /組$/.test(k) ? k : `${k}組`; }
function orderKeys(o,cfg){ const ks=Object.keys(o||{}); const base=cfg?cfg.groups():[]; return [...base.filter(k=>ks.includes(k)),...ks.filter(k=>!base.includes(k)).sort()]; }
function gpText(gp,sep,cfg){ return orderKeys(gp,cfg).filter(k=>gp[k]).map(k=>`${gName(k)}：${gp[k]}`).join(sep); }
function sArr(x){ return Array.isArray(x.s)?x.s:(x.s?[x.s]:[]); }
function stuDesc(x){ return sArr(x).map(t=> t===LATE ? (x.late?`遲到${x.late}分`:"上課遲到") : t==="其他" ? (x.note?`其他（${x.note}）`:"其他") : t).join("、"); }
function stuText(arr,sep){ return (arr||[]).map(x=>`${x.g?x.g+"組 ":""}${x.name}：${stuDesc(x)}`).join(sep); }

/* ---- 年級分頁 / 科目子頁 ---- */
function renderTabs(){
  $("#gtabs").innerHTML = GRADES.map(g=>`<button class="gtab ${g===grade?'on':''}" data-g="${GNUM[g]}" data-v="${g}">${g}</button>`).join("");
  $("#stabs").innerHTML = PAGED[grade] ? SUBJECTS[grade].map(s=>`<button class="stab ${curSubj[grade]===s?'on':''}" data-v="${s}">${s}</button>`).join("") : "";
  $("#tabbar").classList.toggle("hide", curPage==="pg-data");
}
function leaveForm(){ if(curPage!=="pg-add") return; if(editingId) cancelEdit(); else captureDraft(); }
$("#gtabs").addEventListener("click",e=>{
  const b=e.target.closest(".gtab"); if(!b || b.dataset.v===grade) return;
  leaveForm(); grade=b.dataset.v; localStorage.setItem(GKEY,grade); refreshPage();
});
$("#stabs").addEventListener("click",e=>{
  const b=e.target.closest(".stab"); if(!b || b.dataset.v===curSubj[grade]) return;
  leaveForm(); curSubj[grade]=b.dataset.v; localStorage.setItem(SKEY,JSON.stringify(curSubj)); refreshPage();
});
function refreshPage(){ renderTabs(); if(curPage==="pg-add") renderForm(); else if(curPage==="pg-list") renderList(); window.scrollTo(0,0); }

/* ---- 記錄表單 ---- */
function captureDraft(){
  const d=D();
  d.prog=$("#fProg").value; d.perf=$("#fPerf").value;
  d.gp={}; d.gperf={};
  document.querySelectorAll("#gProgBox textarea[data-g]").forEach(t=>{ d.gp[t.dataset.g]=t.value; });
  document.querySelectorAll("#gProgBox textarea[data-gp]").forEach(t=>{ d.gperf[t.dataset.gp]=t.value; });
  d.students=readStudents(true).list;
}
function renderForm(){
  const d=D(), cfg=gcfg(grade,d.subject), paged=!!PAGED[grade];
  // 科目（分頁年級由子頁決定，不顯示按鈕）
  const list=SUBJECTS[grade], box=$("#subjChips");
  $("#subjLbl").style.display = paged ? "none" : "block"; box.style.display = paged ? "none" : "grid";
  box.style.gridTemplateColumns = list.length===1 ? "1fr" : "";
  box.innerHTML = list.map(s=>`<button class="chip ${d.subject===s?'on':''}" data-v="${s}">${s}</button>`).join("");
  // 進度
  $("#fProg").style.display = cfg ? "none" : "block";
  $("#progLbl").textContent = cfg&&cfg.perf ? "進度與課堂表現" : "進度";
  if(cfg) renderGroupProg(cfg); else { $("#fProg").value=d.prog; $("#gProgBox").innerHTML=""; }
  // 課堂表現
  $("#perfField").style.display = cfg&&cfg.perf ? "none" : "block";
  $("#fPerf").style.display = cfg ? "none" : "block";
  $("#fPerf").value = cfg ? "" : d.perf;
  renderStudents(d.students, cfg);
  renderLast();
}
function renderGroupProg(cfg){
  const d=D();
  $("#gProgBox").innerHTML = groupList(cfg,d.gp,d.gperf).map((g,i)=>`<div class="gprog" data-c="${cfg.perf&&i%2?1:0}">
      <div class="gt">${esc(gName(g))}</div>
      ${cfg.perf?'<div class="sl">進度</div>':''}
      <textarea data-g="${esc(g)}" placeholder="${esc(gName(g))}今天的進度">${esc(d.gp[g]||"")}</textarea>
      <div class="gl" data-gl="${esc(g)}"></div>
      ${cfg.perf?`<div class="sl">課堂表現</div><textarea data-gp="${esc(g)}" placeholder="${esc(gName(g))}的課堂表現">${esc(d.gperf[g]||"")}</textarea><div class="stuin" data-sg="${esc(g)}"></div>`:''}
    </div>`).join("");
}
function renderLast(){
  const d=D(), box=$("#lastBox");
  document.querySelectorAll("#gProgBox .gl").forEach(el=>el.innerHTML="");
  if(!d.subject||editingId){ box.style.display="none"; return; }
  const mine=sorted(records).filter(x=>x.grade===grade&&x.subject===d.subject);
  if(gcfg(grade,d.subject)){
    box.style.display="none";
    document.querySelectorAll("#gProgBox .gl").forEach(el=>{
      const g=el.dataset.gl, r=mine.find(x=>x.groupProgress&&x.groupProgress[g]);
      el.innerHTML = r ? `上次（${shortDate(r.date)}）：<b>${esc(r.groupProgress[g])}</b>` : "";
    });
    return;
  }
  const r=mine[0];
  if(!r){ box.style.display="none"; return; }
  box.innerHTML = `上次進度（${fmtDate(r.date)}）：<br><b>${esc(r.progress)||"—"}</b>`;
  box.style.display="block";
}
$("#subjChips").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  captureDraft(); D().subject=b.dataset.v; renderForm();
});

/* ---- 學生狀況（各班名單，可複選） ---- */
function stuRow(st,m){
  const sel=m?sArr(m):[], has=sel.length>0;
  return `<div class="stu${has?' mark':''}" data-id="${esc(st.id)}" data-g="${esc(st.g||"")}" data-name="${esc(st.name)}" data-cls="${esc(st.cls||"")}">
    <div class="head"><div class="nm">${esc(st.name)}<small>${esc(st.cls?st.cls+" 班":st.id)}</small></div><div class="pill">${has?esc(stuDesc(m)):"✓ 正常"}</div></div>
    <div class="opts">
      <div class="og">${STATUSES.map(t=>`<button type="button" class="ob${t==="其他"?" wide":""}${sel.includes(t)?" on":""}" data-s="${t}">${t}</button>`).join("")}</div>
      <div class="extra late${sel.includes(LATE)?" show":""}">遲到 <input class="min" type="number" inputmode="numeric" min="1" max="90" placeholder="分" value="${m&&m.late?esc(m.late):""}"> 分鐘</div>
      <div class="extra oth${sel.includes("其他")?" show":""}"><input class="note" type="text" placeholder="請輸入「其他」狀況" value="${m&&m.note?esc(m.note):""}"></div>
      <button type="button" class="done">收合</button>
    </div>
  </div>`;
}
function grpBlock(label,list,marks){
  return `<details class="grp" open><summary><span>${esc(label)}（${list.length} 人）</span><span class="cnt"></span></summary>${list.map(st=>stuRow(st,marks[st.id])).join("")}</details>`;
}
function renderStudents(prev,cfg){
  const wrap=$("#stuWrap"), box=$("#stuBox"), d=D();
  const marks={}; for(const x of (prev||[])) marks[x.id]=x;
  const list=[...rosterOf(grade,d.subject)]; for(const x of (prev||[])) if(!list.some(s=>s.id===x.id)) list.push({g:x.g,id:x.id,name:x.name,cls:x.cls});
  wrap.style.display="block";
  if(!list.length){
    box.innerHTML=`<div class="nostu">尚未匯入${esc(UNITS.find(u=>u[0]===unitOf(grade,d.subject))?.[1]||"")}名單。請到下方「匯出／名單」頁匯入。</div>`;
    updateCounts(); return;
  }
  if(cfg&&cfg.perf){            // 名單放進各組卡片（依組別對應）
    const gs=cfg.groups(), left=[];
    const slot={}; document.querySelectorAll("#gProgBox .stuin").forEach(el=>{ slot[el.dataset.sg]=el; el.innerHTML=""; });
    const by={};
    for(const st of list){ const k=gs.find(g=>g===st.g||(st.g&&(g.includes(st.g+"組")||g.includes(st.g[0]+"組")))); if(k&&slot[k]) (by[k]=by[k]||[]).push(st); else left.push(st); }
    for(const k in by){ const sub=groupsOf(by[k]); slot[k].innerHTML = sub.length>1 ? sub.map(({g,list})=>grpBlock(`${g} 小組`,list,marks)).join("") : grpBlock(`${gName(k)} 學生`,by[k],marks); }
    wrap.style.display="none"; box.innerHTML="";
    if(left.length){ const el=document.createElement("div"); el.className="stuin"; el.innerHTML=grpBlock("未對應組別的學生",left,marks); $("#gProgBox").appendChild(el); }
  } else {
    box.innerHTML=groupsOf(list).map(({g,list})=>grpBlock(g?`${g} 組`:"學生名單",list,marks)).join("");
  }
  updateCounts();
}
function updateCounts(){
  document.querySelectorAll("#pg-add .grp").forEach(d=>{
    const n=d.querySelectorAll(".stu.mark").length, c=d.querySelector(".cnt");
    c.textContent = n ? `${n} 人有狀況` : "全員正常"; c.classList.toggle("has",n>0);
  });
}
function rowData(row){
  const sel=[...row.querySelectorAll(".ob.on")].map(b=>b.dataset.s);
  const it={g:row.dataset.g,id:row.dataset.id,name:row.dataset.name,s:sel}; if(row.dataset.cls) it.cls=row.dataset.cls;
  if(sel.includes(LATE)){ const v=parseInt(row.querySelector("input.min").value,10); if(v>0) it.late=v; }
  if(sel.includes("其他")){ it.note=row.querySelector("input.note").value.trim(); }
  return it;
}
function refreshRow(row){
  const it=rowData(row), has=it.s.length>0;
  row.classList.toggle("mark",has);
  row.querySelector(".pill").textContent = has ? stuDesc(it) : "✓ 正常";
  row.querySelector(".extra.late").classList.toggle("show",it.s.includes(LATE));
  row.querySelector(".extra.oth").classList.toggle("show",it.s.includes("其他"));
  updateCounts();
}
$("#pg-add").addEventListener("click",e=>{
  const row=e.target.closest(".stu"); if(!row) return;
  if(e.target.closest(".head")||e.target.closest(".done")){ row.classList.toggle("open"); return; }
  const ob=e.target.closest(".ob"); if(!ob) return;
  ob.classList.toggle("on"); refreshRow(row);
  if(ob.classList.contains("on")){ const f= ob.dataset.s===LATE ? "input.min" : ob.dataset.s==="其他" ? "input.note" : null; if(f) row.querySelector(f).focus(); }
});
$("#pg-add").addEventListener("input",e=>{ const row=e.target.closest(".stu"); if(row&&e.target.tagName==="INPUT") refreshRow(row); });
function readStudents(loose){
  const list=[];
  for(const row of document.querySelectorAll("#pg-add .stu")){
    const it=rowData(row); if(!it.s.length) continue;
    if(!loose){
      if(it.s.includes(LATE)&&!it.late){ row.classList.add("open"); return {err:`請輸入 ${it.name} 遲到幾分鐘`,row,f:"input.min"}; }
      if(it.s.includes("其他")&&!it.note){ row.classList.add("open"); return {err:`請填寫 ${it.name} 的「其他」狀況`,row,f:"input.note"}; }
    }
    list.push(it);
  }
  return {list};
}

/* ---- 儲存 / 修改 ---- */
function cancelEdit(){
  editingId=null; document.body.classList.remove("editing");
  $("#saveBtn").textContent="💾 儲存記錄"; $("#cancelEdit").style.display="none";
  resetD(false); $("#fDate").value=todayStr();
}
function trimObj(o){ const r={}; for(const k in (o||{})){ const v=(o[k]||"").trim(); if(v) r[k]=v; } return r; }
$("#saveBtn").addEventListener("click",()=>{
  captureDraft();
  const d=D(), date=$("#fDate").value;
  if(!date) return toast("請選擇日期");
  if(!d.subject) return toast("請選擇科目");
  const cfg=gcfg(grade,d.subject), rec={date,grade,subject:d.subject};
  if(cfg){
    const gp=trimObj(d.gp), gperf=cfg.perf?trimObj(d.gperf):{};
    if(!Object.keys(gp).length){ const t=$("#gProgBox textarea[data-g]"); if(t) t.focus(); return toast("請至少填寫一組的進度"); }
    let students=[];
    { const st=readStudents(false); if(st.err){ st.row.querySelector(st.f).focus(); return toast(st.err); } students=st.list; }
    const oldPerf=editingId?((records.find(x=>x.id===editingId)||{}).performance||""):"";
    Object.assign(rec,{groupProgress:gp,progress:gpText(gp,"\n",cfg),students});
    if(cfg.perf){ rec.groupPerf=gperf; rec.performance=gpText(gperf,"\n",cfg); } else rec.performance=oldPerf;
  } else {
    const progress=d.prog.trim(); if(!progress){ $("#fProg").focus(); return toast("請填寫進度"); }
    const st=readStudents(false); if(st.err){ st.row.querySelector(st.f).focus(); return toast(st.err); }
    Object.assign(rec,{progress,performance:d.perf.trim(),students:st.list});
  }
  if(editingId){
    const r=records.find(x=>x.id===editingId);
    for(const k of ["groupProgress","groupPerf","performance","students"]) delete r[k];
    Object.assign(r,rec,{updated:Date.now()});
    save(); toast("✅ 已更新"); cancelEdit(); go("pg-list"); return;
  }
  records.push(Object.assign({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),created:Date.now()},rec));
  save(); toast("✅ 已儲存");
  resetD(true); renderForm(); window.scrollTo({top:0,behavior:"smooth"});
});
$("#cancelEdit").addEventListener("click",()=>{ cancelEdit(); go("pg-list"); });
function startEdit(r){
  if(curPage==="pg-add"&&!editingId) captureDraft();
  grade=r.grade; localStorage.setItem(GKEY,grade);
  if(PAGED[grade]){ curSubj[grade]=r.subject; localStorage.setItem(SKEY,JSON.stringify(curSubj)); }
  editingId=r.id;
  const cfg=gcfg(r.grade,r.subject);
  drafts[dkey()]={subject:r.subject, prog:r.progress||"", perf:r.performance||"",
    gp: r.groupProgress ? {...r.groupProgress} : (cfg&&r.progress ? {"（未分組）":r.progress} : {}),
    gperf: r.groupPerf ? {...r.groupPerf} : (cfg&&cfg.perf&&r.performance ? {"（未分組）":r.performance} : {}),
    students:r.students||[]};
  $("#fDate").value=r.date;
  document.body.classList.add("editing"); $("#saveBtn").textContent="💾 更新這筆記錄";
  $("#cancelEdit").style.display="block"; go("pg-add");
}

/* ---- 歷史 ---- */
function renderList(){
  const paged=!!PAGED[grade];
  const f=paged ? curSubj[grade] : (subjFilter[grade]||"全部");
  const keys=["全部",...SUBJECTS[grade]];
  $("#filters").innerHTML = !paged && keys.length>2 ? keys.map(k=>`<button class="chip ${f===k?'on':''}" data-v="${k}">${k}</button>`).join("") : "";
  const rows = sorted(records).filter(r=> r.grade===grade && (f==="全部"||r.subject===f));
  $("#countLbl").textContent = `${paged?grade+"・"+f:grade}：共 ${rows.length} 筆`;
  $("#list").innerHTML = rows.length ? rows.map(r=>{
    const cfg=gcfg(r.grade,r.subject);
    let body;
    if(r.groupProgress||r.groupPerf){
      const ks=orderKeys(Object.assign({},r.groupProgress,r.groupPerf),cfg);
      body = r.groupPerf
        ? ks.map(k=>`<div class="k">${esc(gName(k))}</div>${r.groupProgress&&r.groupProgress[k]?`<div class="v">進度：${esc(r.groupProgress[k])}</div>`:""}${r.groupPerf[k]?`<div class="v">表現：${esc(r.groupPerf[k])}</div>`:""}`).join("")
        : `<div class="k">進度</div>`+ks.map(k=>`<div class="v"><b>${esc(gName(k))}｜</b>${esc(r.groupProgress[k])}</div>`).join("")
          + (r.performance?`<div class="k">課堂表現</div><div class="v">${esc(r.performance)}</div>`:"");
    } else {
      body = `<div class="k">進度</div><div class="v">${esc(r.progress)}</div>` + (r.performance?`<div class="k">課堂表現</div><div class="v">${esc(r.performance)}</div>`:"");
    }
    return `<div class="rec" data-g="${GNUM[r.grade]||0}">
      <div class="top"><span class="date">${fmtDate(r.date)}</span><span class="tag">${esc(r.subject)}</span></div>
      ${body}
      ${r.students&&r.students.length?`<div class="k">學生狀況（${r.students.length} 人）</div><div class="v">${esc(stuText(r.students,"\n"))}</div>`:""}
      <div class="acts"><button data-act="edit" data-id="${r.id}">✏️ 修改</button><button class="del" data-act="del" data-id="${r.id}">🗑 刪除</button></div>
    </div>`; }).join("") : `<div class="empty">還沒有記錄<br>到「記錄」頁新增第一筆吧</div>`;
}
$("#filters").addEventListener("click",e=>{ const b=e.target.closest(".chip"); if(!b) return; subjFilter[grade]=b.dataset.v; renderList(); });
$("#list").addEventListener("click",e=>{
  const b=e.target.closest("button[data-act]"); if(!b) return;
  const r=records.find(x=>x.id===b.dataset.id); if(!r) return;
  if(b.dataset.act==="del"){
    if(confirm(`確定刪除 ${fmtDate(r.date)} ${r.grade}${r.subject} 這筆記錄？`)){
      records=records.filter(x=>x.id!==r.id); save(); renderList(); toast("已刪除"); }
  } else startEdit(r);
});

/* ---- 匯出 / 備份 ---- */
function download(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); }
$("#exportXlsx").addEventListener("click",()=>{
  if(!records.length) return toast("目前沒有資料");
  if(typeof XLSX==="undefined") return toast("Excel 模組載入中，請稍候再試");
  const wb=XLSX.utils.book_new();
  const all=[...records].sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created);
  const H=["日期","年級","科目","進度","課堂表現","學生狀況"];
  const ws0=XLSX.utils.json_to_sheet(all.map(r=>({"日期":r.date,"年級":r.grade,"科目":r.subject,"進度":r.groupProgress?gpText(r.groupProgress,"；",gcfg(r.grade,r.subject)):r.progress,"課堂表現":r.groupPerf?gpText(r.groupPerf,"；",gcfg(r.grade,r.subject)):(r.performance||""),"學生狀況":stuText(r.students,"；")})),{header:H});
  ws0["!cols"]=[{wch:12},{wch:8},{wch:12},{wch:50},{wch:30},{wch:50}]; XLSX.utils.book_append_sheet(wb,ws0,"全部");
  for(const g of GRADES) for(const s of SUBJECTS[g]){
    const arr=all.filter(r=>r.grade===g&&r.subject===s); if(!arr.length) continue;
    const name=(g.replace("年級","年")+s).slice(0,31);
    const cfg=gcfg(g,s);
    if(cfg){
      const gl=groupList(cfg,...arr.map(r=>r.groupProgress),...arr.map(r=>r.groupPerf));
      const hasOld=arr.some(r=>!r.groupProgress&&r.progress), hasPerf=!cfg.perf&&arr.some(r=>r.performance), hasStu=cfg.stu;
      const cols=[];
      for(const k of gl){ cols.push([`${gName(k)}進度`,r=>(r.groupProgress||{})[k]||""]); if(cfg.perf) cols.push([`${gName(k)}課堂表現`,r=>(r.groupPerf||{})[k]||""]); }
      if(hasOld){ cols.push(["進度（未分組）",r=>r.groupProgress?"":(r.progress||"")]); if(cfg.perf) cols.push(["課堂表現（未分組）",r=>r.groupPerf?"":(r.performance||"")]); }
      if(hasPerf) cols.push(["課堂表現",r=>r.performance||""]);
      if(hasStu||arr.some(r=>r.students&&r.students.length)) cols.push(["學生狀況",r=>stuText(r.students,"；")]);
      const hdr=["日期","科目",...cols.map(c=>c[0])];
      const rows=arr.map(r=>{ const o={"日期":r.date,"科目":r.subject}; for(const [h,f] of cols) o[h]=f(r); return o; });
      const ws=XLSX.utils.json_to_sheet(rows,{header:hdr});
      ws["!cols"]=hdr.map(h=>({wch:h==="日期"?12:h==="科目"?10:h==="學生狀況"?50:30})); XLSX.utils.book_append_sheet(wb,ws,name);
    } else {
      const hs=arr.some(r=>r.students&&r.students.length);
      const hdr=["日期","科目","進度","課堂表現",...(hs?["學生狀況"]:[])];
      const ws=XLSX.utils.json_to_sheet(arr.map(r=>{ const o={"日期":r.date,"科目":r.subject,"進度":r.progress,"課堂表現":r.performance||""}; if(hs) o["學生狀況"]=stuText(r.students,"；"); return o; }),{header:hdr});
      ws["!cols"]=[{wch:12},{wch:12},{wch:45},{wch:45},{wch:50}]; XLSX.utils.book_append_sheet(wb,ws,name);
    }
  }
  const det=[]; const cnt={};
  const uLabel=u=>(UNITS.find(x=>x[0]===u)||[u,u.replace("|"," ")])[1];
  for(const r of all) for(const x of (r.students||[])){
    const u=unitOf(r.grade,r.subject), ss=sArr(x);
    det.push({"日期":r.date,"年級":r.grade,"科目":r.subject,"組別":x.g||"","班級座號":x.cls||x.id,"姓名":x.name,"狀況":ss.join("、"),"遲到分鐘":x.late||"","其他說明":x.note||""});
    const key=u+"#"+x.id, c=cnt[key]||(cnt[key]={u,g:x.g||"",id:x.id,cls:x.cls,name:x.name,n:{},late:0,tot:0});
    for(const t of ss) c.n[t]=(c.n[t]||0)+1; c.late+=x.late||0; c.tot++;
  }
  if(det.length){
    const H1=["日期","年級","科目","組別","班級座號","姓名","狀況","遲到分鐘","其他說明"];
    const ws=XLSX.utils.json_to_sheet(det,{header:H1});
    ws["!cols"]=[{wch:12},{wch:8},{wch:10},{wch:6},{wch:10},{wch:10},{wch:24},{wch:9},{wch:28}]; XLSX.utils.book_append_sheet(wb,ws,"學生狀況明細");
    const base=[]; for(const [u] of UNITS) for(const st of (rosters[u]||[])) base.push({u,g:st.g||"",id:st.id,cls:st.cls,name:st.name});
    for(const k in cnt){ const c=cnt[k]; if(!base.some(b=>b.u===c.u&&b.id===c.id)) base.push({u:c.u,g:c.g,id:c.id,cls:c.cls,name:c.name}); }
    const uo=u=>{ const i=UNITS.findIndex(x=>x[0]===u); return i<0?99:i; };
    const rows=base.sort((a,b)=>uo(a.u)-uo(b.u)||a.g.localeCompare(b.g)||a.id.localeCompare(b.id)).map(b=>{ const c=cnt[b.u+"#"+b.id]||{n:{},late:0,tot:0};
      const o={"班別":uLabel(b.u),"組別":b.g,"班級座號":b.cls||b.id,"姓名":b.name}; for(const t of STATUSES) o[t]=c.n[t]||0; o["遲到累計分鐘"]=c.late; o["有狀況節數"]=c.tot; return o; });
    const H2=["班別","組別","班級座號","姓名",...STATUSES,"遲到累計分鐘","有狀況節數"];
    const ws2=XLSX.utils.json_to_sheet(rows,{header:H2});
    ws2["!cols"]=[{wch:18},{wch:6},{wch:10},{wch:10},...STATUSES.map(()=>({wch:10})),{wch:12},{wch:11}]; XLSX.utils.book_append_sheet(wb,ws2,"學生狀況統計");
  }
  const name=`教學進度記錄_${todayStr()}.xlsx`;
  const blob=new Blob([XLSX.write(wb,{bookType:"xlsx",type:"array"})],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  shareOrDownload(blob,name,"📊 已匯出");
});
async function shareOrDownload(blob,name,msg){
  try{
    const file=new File([blob],name,{type:blob.type});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:name}); toast(msg); return true;
    }
  }catch(err){ if(err && err.name==="AbortError") return false; }
  download(blob,name); toast(msg); return true;
}
$("#backupBtn").addEventListener("click",async ()=>{
  if(!records.length) return toast("目前沒有資料");
  const ok=await shareOrDownload(new Blob([JSON.stringify({app:"teaching-log",version:3,exported:new Date().toISOString(),records,rosters},null,2)],{type:"application/json"}),`教學進度備份_${todayStr()}.json`,"⬇️ 已備份");
  if(ok){ localStorage.setItem(KEY+".lastBackup",Date.now()); renderStats(); }
});
$("#restoreBtn").addEventListener("click",()=>$("#restoreFile").click());
$("#restoreFile").addEventListener("change",async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const data=JSON.parse(await f.text()); const inc=Array.isArray(data)?data:data.records;
    if(!Array.isArray(inc)) throw 0;
    const ids=new Set(records.map(r=>r.id)); let n=0;
    for(const r of inc){ if(r&&r.id&&r.date&&!ids.has(r.id)){ records.push(r); n++; } }
    let rmsg="";
    if(data.rosters&&typeof data.rosters==="object"){ for(const u in data.rosters) if(Array.isArray(data.rosters[u])&&data.rosters[u].length) rosters[u]=data.rosters[u]; saveRosters(); renderRoster(); rmsg="，含名單"; }
    else if(Array.isArray(data.roster)&&data.roster.length){ rosters["三年級"]=data.roster; saveRosters(); renderRoster(); rmsg="，含名單"; }
    for(const r of records) for(const x of (r.students||[])) if(!Array.isArray(x.s)) x.s=x.s?[x.s]:[];
    save(); renderStats(); toast(`已還原 ${n} 筆${rmsg}（重複的略過）`);
  }catch(err){ toast("檔案格式不正確"); }
  e.target.value="";
});
$("#wipeBtn").addEventListener("click",()=>{
  if(!records.length) return toast("目前沒有資料");
  if(confirm("確定清除全部記錄？建議先備份。此動作無法復原。") && confirm("再確認一次：真的要全部刪除？")){
    records=[]; save(); renderStats(); toast("已清除");
  }
});
function renderStats(){
  const lines=[`總記錄：<b>${records.length}</b> 筆`];
  for(const g of GRADES) for(const s of SUBJECTS[g]){
    const arr=records.filter(r=>r.grade===g&&r.subject===s);
    if(arr.length){ const last=arr.reduce((a,b)=>a.date>b.date?a:b); lines.push(`${g}・${s}：${arr.length} 筆（最近 ${shortDate(last.date)}）`); }
  }
  $("#stats").innerHTML=lines.join("<br>");
  const lb=+localStorage.getItem(KEY+".lastBackup")||0, days=Math.floor((Date.now()-lb)/864e5);
  const rb=$("#backupRemind");
  if(records.length>=5 && (!lb || days>=30)){ rb.textContent = lb ? `⚠️ 已經 ${days} 天沒有備份了，建議按下方「備份」` : "⚠️ 尚未備份過，建議按下方「備份」存一份"; rb.style.display="block"; }
  else rb.style.display="none";
}

/* ---- 導覽 ---- */
function go(id){
  curPage=id;
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("on",p.id===id));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.pg===id));
  renderTabs();
  if(id==="pg-add") renderForm(); if(id==="pg-list") renderList(); if(id==="pg-data") renderStats();
  window.scrollTo(0,0);
}
document.querySelector("nav").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b||b.dataset.pg===curPage) return;
  if(curPage==="pg-add"){ if(editingId) cancelEdit(); else captureDraft(); }
  go(b.dataset.pg); });

let shownToday=todayStr();
function checkDay(){
  const t=todayStr(); if(t===shownToday) return;
  if(!editingId && $("#fDate").value===shownToday) $("#fDate").value=t;
  shownToday=t; $("#todayLbl").textContent=fmtDate(t);
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) checkDay(); });
window.addEventListener("focus",checkDay);
$("#todayLbl").textContent=fmtDate(shownToday);
$("#fDate").value=todayStr();
renderTabs(); renderForm();
/* ---- 學生名單管理（各班別） ---- */
let rUnit = UNITS[0][0];
function renderRoster(){
  $("#rUnits").innerHTML = UNITS.map(([u,l])=>`<button class="chip ${u===rUnit?'on':''}" data-u="${u}">${l}${(rosters[u]||[]).length?`（${rosters[u].length}）`:""}</button>`).join("");
  const ro=rosters[rUnit]||[], gs=groupsOf(ro), lbl=UNITS.find(u=>u[0]===rUnit)[1];
  const note = rUnit==="一年級|自然探究" ? "<br>組別以 A 開頭（A、A1…）放進週四A組，以 B 開頭放進週一B組。" : "";
  $("#rosterInfo").innerHTML = ro.length
    ? `${esc(lbl)}：<b style="color:var(--text)">${ro.length} 人</b>${gs.some(x=>x.g)?`（${gs.map(x=>x.g?`${esc(x.g)} 組 ${x.list.length} 人`:`未分組 ${x.list.length} 人`).join("、")}）`:""}${note}<br>名單只存在這台裝置，不會上傳到網路。`
    : `${esc(lbl)}：尚未匯入。格式：組別,班級座號,姓名（沒有分組可只填 班級座號,姓名）。${note}<br>名單只存在這台裝置，不會上傳到網路。`;
  $("#rosterClear").style.display = ro.length ? "block" : "none";
}
$("#rUnits").addEventListener("click",e=>{ const b=e.target.closest(".chip"); if(!b) return; rUnit=b.dataset.u; renderRoster(); });
function applyRoster(text){
  const list=parseRoster(text), lbl=UNITS.find(u=>u[0]===rUnit)[1];
  if(!list.length) return toast("讀不到名單，請確認格式");
  const ids=new Set(); for(const s of list){ if(ids.has(s.id)) return toast(`${s.cls?s.cls+" 班 "+s.name:"座號 "+s.id} 重複`); ids.add(s.id); }
  const cur=rosters[rUnit]||[];
  if(cur.length && !confirm(`以新名單（${list.length} 人）取代「${lbl}」目前名單（${cur.length} 人）？\n已存的記錄不受影響。`)) return;
  if(curPage==="pg-add") captureDraft(); rosters[rUnit]=list; saveRosters(); renderRoster(); toast(`✅ ${lbl}：已匯入 ${list.length} 位學生`);
  $("#rosterText").style.display="none"; $("#rosterPasteRow").style.display="none"; $("#rosterText").value="";
}
$("#rosterFileBtn").addEventListener("click",()=>$("#rosterFile").click());
$("#rosterFile").addEventListener("change",async e=>{
  const f=e.target.files[0]; if(!f) return;
  let buf=await f.arrayBuffer(), text=new TextDecoder("utf-8").decode(buf);
  if(text.includes("�")){ try{ text=new TextDecoder("big5").decode(buf); }catch(err){} }
  applyRoster(text); e.target.value="";
});
$("#rosterPasteBtn").addEventListener("click",()=>{
  const t=$("#rosterText"), show=t.style.display!=="block";
  t.style.display=show?"block":"none"; $("#rosterPasteRow").style.display=show?"flex":"none"; if(show) t.focus();
});
$("#rosterPasteOk").addEventListener("click",()=>applyRoster($("#rosterText").value));
$("#rosterClear").addEventListener("click",()=>{
  const lbl=UNITS.find(u=>u[0]===rUnit)[1];
  if(confirm(`確定清除「${lbl}」名單？已存的記錄不受影響。`)){ delete rosters[rUnit]; saveRosters(); renderRoster(); toast("已清除名單"); }
});
renderRoster();

/* ---- 安裝引導 ---- */
(function(){
  const ua=navigator.userAgent, HIDE=KEY+".installHide";
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  if(standalone||localStorage.getItem(HIDE)) return;
  const box=$("#installBox"), T=$("#instT"), D=$("#instD"), go=$("#instGo");
  const isIOS=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const isAndroid=/Android/.test(ua);
  const inApp=/Line\/|FBAN|FBAV|Instagram|GSA\/|; wv\)|MicroMessenger/.test(ua);
  const show=(t,d)=>{T.textContent=t;D.innerHTML=d;box.style.display="block";};
  if(inApp){
    show("⚠️ 目前不是在瀏覽器中開啟", isIOS
      ? "這個視窗無法安裝。請點右上角「⋯」或分享鍵，選<b>「用 Safari 開啟」</b>，再依提示加入主畫面。"
      : "這個視窗無法安裝。請點右上角「⋮」，選<b>「在 Chrome 中開啟」</b>，再依提示安裝。");
  } else if(isIOS){
    if(/CriOS|FxiOS|EdgiOS/.test(ua)) show("請改用 Safari 開啟","iPad／iPhone 只有 <b>Safari</b> 能把 App 加到主畫面。請複製網址到 Safari 開啟。");
    else show("📲 加到主畫面","點網址列旁的<b>分享鍵 ⬆️</b>，往下找<b>「加入主畫面」</b>，再按「新增」。");
  } else if(isAndroid){
    show("📲 安裝到主畫面","點右上角 <b>⋮</b> 選單，選<b>「加到主畫面」</b>→<b>「安裝」</b>。");
  }
  window.addEventListener("beforeinstallprompt",e=>{
    e.preventDefault(); window._bip=e;
    show("📲 安裝到主畫面","按下方按鈕，即可把 App 安裝到主畫面，之後不用網路也能開。");
    go.style.display="block";
  });
  go.addEventListener("click",async()=>{ const e=window._bip; if(!e) return; e.prompt(); const r=await e.userChoice; if(r.outcome==="accepted") box.style.display="none"; window._bip=null; });
  window.addEventListener("appinstalled",()=>{ box.style.display="none"; toast("✅ 已安裝到主畫面"); });
  $("#instNo").addEventListener("click",()=>{ localStorage.setItem(HIDE,"1"); box.style.display="none"; });
})();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();
</script>
