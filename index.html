<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="教學進度">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>教學進度記錄表</title>
<style>
:root{
  --bg:#0f1419; --card:#1a2129; --card2:#222b35; --line:#33404d;
  --text:#f2f5f8; --muted:#9fb0c0; --accent:#ffc940; --accent-ink:#1a1400;
  --g1:#4fc3f7; --g2:#81c784; --g3:#ff8a65; --danger:#ff6b6b;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:20px;line-height:1.5}
body{padding:env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom))}
.wrap{max-width:820px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 16px}
header h1{font-size:28px;margin:0;letter-spacing:1px}
header .today{color:var(--muted);font-size:18px}

/* 表單 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
label.lbl{display:block;font-size:20px;font-weight:700;color:var(--accent);margin:0 0 10px}
.field{margin-bottom:22px}
.field:last-child{margin-bottom:0}
input[type=date],textarea{width:100%;font:inherit;font-size:22px;color:var(--text);
  background:var(--card2);border:2px solid var(--line);border-radius:12px;padding:14px 16px;outline:none}
input[type=date]{min-height:60px;color-scheme:dark;-webkit-appearance:none;appearance:none;display:block;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus{border-color:var(--accent)}
.chips{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}
.chips.two{grid-template-columns:repeat(2,1fr)}
.chip{font:inherit;font-size:22px;font-weight:700;min-height:64px;border-radius:12px;
  border:2px solid var(--line);background:var(--card2);color:var(--text);cursor:pointer;padding:8px}
.chip.on{border-color:transparent;color:#0b0f13}
.chip.on[data-g="1"]{background:var(--g1)} .chip.on[data-g="2"]{background:var(--g2)} .chip.on[data-g="3"]{background:var(--g3)}
.subj .chip.on{background:var(--accent);color:var(--accent-ink)}
.hint{font-size:18px;color:var(--muted);margin-top:8px}
.last{background:#14202b;border-left:5px solid var(--g1);border-radius:10px;padding:12px 14px;font-size:18px;color:#cfe3f2;margin-top:12px;display:none}
.last b{color:var(--text)}
.btn{font:inherit;font-size:24px;font-weight:800;width:100%;min-height:68px;border:none;border-radius:14px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--card2);color:var(--text);border:2px solid var(--line);font-size:20px;min-height:58px}
.btn.danger{background:transparent;color:var(--danger);border:2px solid var(--danger);font-size:20px;min-height:58px}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* 列表 */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.filters .chip{flex:0 0 auto;min-height:52px;font-size:19px;padding:6px 16px}
.filters .chip.on{background:var(--accent);color:var(--accent-ink)}
.rec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;border-left:8px solid var(--line)}
.rec[data-g="1"]{border-left-color:var(--g1)} .rec[data-g="2"]{border-left-color:var(--g2)} .rec[data-g="3"]{border-left-color:var(--g3)}
.rec .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rec .date{font-size:22px;font-weight:800}
.tag{font-size:17px;font-weight:700;padding:3px 10px;border-radius:8px;background:var(--card2);border:1px solid var(--line)}
.rec .k{color:var(--accent);font-weight:700;font-size:17px;margin-top:10px}
.rec .v{font-size:21px;white-space:pre-wrap;word-break:break-word}
.rec .acts{display:flex;gap:10px;margin-top:12px}
.rec .acts button{flex:1;font:inherit;font-size:18px;min-height:48px;border-radius:10px;background:var(--card2);color:var(--text);border:1px solid var(--line)}
.rec .acts .del{color:var(--danger);border-color:#5a2a2a}
.empty{text-align:center;color:var(--muted);padding:48px 12px;font-size:20px}
.count{color:var(--muted);font-size:18px;margin:0 4px 10px}

/* 底部導覽 */
nav{position:fixed;left:0;right:0;bottom:0;background:#0b0f13;border-top:1px solid var(--line);
  display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;font:inherit;font-size:19px;font-weight:700;color:var(--muted);background:none;border:none;
  min-height:64px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button .ic{font-size:26px;line-height:1}
nav button.on{color:var(--accent);background:#1a2129}
.page{display:none}.page.on{display:block}

.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);
  font-weight:800;font-size:20px;padding:14px 26px;border-radius:30px;opacity:0;pointer-events:none;transition:.25s;z-index:20}
.toast.show{opacity:1}
.editing-bar{display:none;background:#3a2f0a;color:var(--accent);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-weight:700}
.editing .editing-bar{display:block}
.install{background:#14202b;border:2px solid var(--g1);border-radius:14px;padding:14px 16px;margin-bottom:16px;display:none}
.install .t{font-weight:800;font-size:21px;color:var(--g1);margin-bottom:6px}
.install .d{font-size:19px;line-height:1.6}
.install .row{margin-top:12px}
.install button{font:inherit;font-size:20px;font-weight:800;min-height:56px;border-radius:12px;border:none;cursor:pointer}
.install .go{background:var(--g1);color:#0b0f13}
.install .no{background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.stuwrap{margin-top:14px;display:none}
.stuwrap .sub{font-size:19px;font-weight:800;color:var(--text);margin:4px 0 8px}
.grp{background:var(--card2);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.grp summary{list-style:none;cursor:pointer;padding:14px 16px;font-size:20px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.grp summary::-webkit-details-marker{display:none}
.grp summary .cnt{font-size:17px;font-weight:700;color:var(--muted)}
.grp summary .cnt.has{color:var(--accent)}
.stu{padding:10px 14px;border-top:1px solid var(--line)}
.stu .line{display:flex;align-items:center;gap:10px}
.stu .nm{flex:1;font-size:21px;font-weight:700;min-width:0}
.stu .nm small{display:block;font-size:15px;color:var(--muted);font-weight:400}
.stu select{flex:0 0 52%;font:inherit;font-size:19px;min-height:52px;color:var(--text);background:#141a21;border:2px solid var(--line);border-radius:10px;padding:6px 10px;color-scheme:dark}
.stu.mark{background:#2a2410}
.stu.mark select{border-color:var(--accent);color:var(--accent);font-weight:700}
.stu input.other{display:none;width:100%;margin-top:8px;font:inherit;font-size:20px;color:var(--text);background:#141a21;border:2px solid var(--accent);border-radius:10px;padding:10px 12px;outline:none}
.stu.isother input.other{display:block}
.nostu{font-size:18px;color:var(--muted);background:var(--card2);border-radius:10px;padding:12px 14px}
textarea.roster{min-height:160px;font-size:18px;margin-top:12px;display:none}
.remind{background:#3a2f0a;color:var(--accent);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-weight:700;display:none}
@media (min-width:700px){ html,body{font-size:21px} .wrap{padding:24px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📘 教學進度</h1>
    <div class="today" id="todayLbl"></div>
  </header>

  <!-- 記錄頁 -->
  <section class="page on" id="pg-add">
    <div class="install" id="installBox">
      <div class="t" id="instT"></div>
      <div class="d" id="instD"></div>
      <div class="row"><button class="go" id="instGo" style="display:none">📲 安裝到主畫面</button><button class="no" id="instNo">不再顯示</button></div>
    </div>
    <div class="editing-bar">✏️ 正在修改一筆舊記錄</div>
    <div class="card">
      <div class="field">
        <label class="lbl" for="fDate">日期</label>
        <input type="date" id="fDate">
      </div>
      <div class="field">
        <label class="lbl">年級</label>
        <div class="chips" id="gradeChips"></div>
      </div>
      <div class="field subj">
        <label class="lbl">科目</label>
        <div class="chips two" id="subjChips"></div>
        <div class="hint" id="subjHint">請先選擇年級</div>
        <div class="last" id="lastBox"></div>
      </div>
      <div class="field">
        <label class="lbl" for="fProg">進度</label>
        <textarea id="fProg" placeholder="例：3-2 酸鹼中和，完成課本 p.68–72"></textarea>
      </div>
      <div class="field">
        <label class="lbl" for="fPerf">課堂表現</label>
        <textarea id="fPerf" placeholder="例：專注度佳；滴定實驗操作需再練習"></textarea>
        <div class="stuwrap" id="stuWrap">
          <div class="sub">👥 學生狀況（未選＝正常）</div>
          <div id="stuBox"></div>
        </div>
      </div>
    </div>
    <button class="btn primary" id="saveBtn">💾 儲存記錄</button>
    <div style="height:10px"></div>
    <button class="btn ghost" id="cancelEdit" style="display:none">取消修改</button>
  </section>

  <!-- 歷史頁 -->
  <section class="page" id="pg-list">
    <div class="filters" id="filters"></div>
    <div class="count" id="countLbl"></div>
    <div id="list"></div>
  </section>

  <!-- 資料頁 -->
  <section class="page" id="pg-data">
    <div class="remind" id="backupRemind"></div>
    <div class="card">
      <label class="lbl">匯出 Excel</label>
      <div class="hint" style="margin:0 0 14px">每個「年級＋科目」各一個工作表，依日期排序。</div>
      <button class="btn primary" id="exportXlsx">📊 匯出 Excel 檔</button>
    </div>
    <div class="card">
      <label class="lbl">三年級分組名單</label>
      <div class="hint" style="margin:0 0 14px" id="rosterInfo"></div>
      <div class="row">
        <button class="btn ghost" id="rosterFileBtn">📄 匯入名單檔</button>
        <button class="btn ghost" id="rosterPasteBtn">📋 貼上名單</button>
      </div>
      <input type="file" id="rosterFile" accept=".csv,.txt,text/csv,text/plain" hidden>
      <textarea class="roster" id="rosterText" placeholder="每行一位：組別,班級座號,姓名&#10;例：A,30101,王小明"></textarea>
      <div class="row" id="rosterPasteRow" style="display:none;margin-top:10px">
        <button class="btn primary" id="rosterPasteOk" style="font-size:20px;min-height:58px">✅ 套用名單</button>
      </div>
      <div style="height:10px"></div>
      <button class="btn danger" id="rosterClear" style="display:none">清除名單</button>
    </div>
    <div class="card">
      <label class="lbl">備份與還原</label>
      <div class="hint" style="margin:0 0 14px">資料只存在這台裝置的瀏覽器裡。建議每月備份一次，換手機或清除瀏覽器資料前務必備份。</div>
      <div class="row">
        <button class="btn ghost" id="backupBtn">⬇️ 備份</button>
        <button class="btn ghost" id="restoreBtn">⬆️ 還原</button>
      </div>
      <input type="file" id="restoreFile" accept=".json,application/json" hidden>
    </div>
    <div class="card">
      <label class="lbl">統計</label>
      <div id="stats" class="v" style="font-size:20px"></div>
    </div>
    <button class="btn danger" id="wipeBtn">🗑 清除全部資料</button>
    <div class="hint" style="text-align:center;margin-top:18px">教學進度記錄表 v1.4</div>
  </section>
</div>

<nav>
  <button data-pg="pg-add" class="on"><span class="ic">✍️</span>記錄</button>
  <button data-pg="pg-list"><span class="ic">📋</span>歷史</button>
  <button data-pg="pg-data"><span class="ic">📊</span>匯出／名單</button>
</nav>
<div class="toast" id="toast"></div>

<script src="xlsx.full.min.js" defer></script>
<script>
const SUBJECTS = {
  "一年級": ["自然實驗","自然閱讀"],
  "二年級": ["雄科特訓班"],
  "三年級": ["理化","地球科學"]
};
const GNUM = {"一年級":1,"二年級":2,"三年級":3};
const KEY = "teachingLog.v1";
const ROSTER_GRADE = "三年級";
const STATUSES = ["精神不佳","教材未帶","上課分心","身體不適","作業未完成","其他"];
const RKEY = KEY+".roster";
let roster = (()=>{ try{ return JSON.parse(localStorage.getItem(RKEY))||[]; }catch(e){ return []; } })();
function saveRoster(){ localStorage.setItem(RKEY, JSON.stringify(roster)); }
function parseRoster(text){
  const out=[];
  for(let line of text.replace(/^\uFEFF/,"").split(/\r?\n/)){
    line=line.trim(); if(!line) continue;
    const c=line.split(/[,\t，]/).map(x=>x.trim().replace(/^"|"$/g,""));
    if(c.length<3) continue;
    if(/組別|座號|姓名/.test(c[0]+c[1]+c[2])) continue;
    out.push({g:c[0].toUpperCase(), id:c[1], name:c[2]});
  }
  return out;
}
function groupsOf(list){ const m={}; for(const s of list){ (m[s.g]=m[s.g]||[]).push(s); } return Object.keys(m).sort().map(g=>({g,list:m[g]})); }
const $ = s => document.querySelector(s);

let records = load();
let sel = {grade:null, subject:null};
let editingId = null;
let filter = "全部";

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; } }
function save(){ localStorage.setItem(KEY, JSON.stringify(records)); }
function todayStr(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function fmtDate(s){ const d=new Date(s+"T00:00"); const w="日一二三四五六"[d.getDay()]; return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}（${w}）`; }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }
function sorted(arr){ return [...arr].sort((a,b)=> b.date.localeCompare(a.date) || b.created-a.created); }

/* ---- 表單 ---- */
function renderGrades(){
  $("#gradeChips").innerHTML = Object.keys(SUBJECTS).map(g =>
    `<button class="chip ${sel.grade===g?'on':''}" data-g="${GNUM[g]}" data-v="${g}">${g}</button>`).join("");
}
function renderSubjects(){
  const box=$("#subjChips"), hint=$("#subjHint");
  if(!sel.grade){ box.innerHTML=""; hint.style.display="block"; renderLast(); return; }
  hint.style.display="none";
  const list = SUBJECTS[sel.grade];
  box.className = "chips " + (list.length===1 ? "" : "two");
  if(list.length===1) box.style.gridTemplateColumns="1fr"; else box.style.gridTemplateColumns="";
  box.innerHTML = list.map(s=>`<button class="chip ${sel.subject===s?'on':''}" data-v="${s}">${s}</button>`).join("");
  renderLast();
}
function renderLast(){
  const box=$("#lastBox");
  if(!sel.grade||!sel.subject||editingId){ box.style.display="none"; return; }
  const r = sorted(records).find(x=>x.grade===sel.grade&&x.subject===sel.subject);
  if(!r){ box.style.display="none"; return; }
  box.innerHTML = `上次進度（${fmtDate(r.date)}）：<br><b>${esc(r.progress)||"—"}</b>`;
  box.style.display="block";
}
$("#gradeChips").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  if(sel.grade!==b.dataset.v){ sel.grade=b.dataset.v; sel.subject=null;
    if(SUBJECTS[sel.grade].length===1) sel.subject=SUBJECTS[sel.grade][0];
    renderStudents(); }
  renderGrades(); renderSubjects();
});
$("#subjChips").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  sel.subject=b.dataset.v; renderSubjects();
});
function renderStudents(prev){
  const wrap=$("#stuWrap"), box=$("#stuBox");
  if(sel.grade!==ROSTER_GRADE){ wrap.style.display="none"; box.innerHTML=""; return; }
  wrap.style.display="block";
  const marks={}; for(const x of (prev||[])) marks[x.id]=x;
  // 修改舊記錄時，若名單已變更，仍保留舊記錄中的學生
  const list=[...roster]; for(const x of (prev||[])) if(!list.some(s=>s.id===x.id)) list.push({g:x.g,id:x.id,name:x.name});
  if(!list.length){ box.innerHTML='<div class="nostu">尚未匯入分組名單。請到下方「匯出／名單」頁匯入。</div>'; return; }
  box.innerHTML=groupsOf(list).map(({g,list})=>`<details class="grp" open data-g="${esc(g)}">
    <summary><span>${esc(g)} 組（${list.length} 人）</span><span class="cnt"></span></summary>
    ${list.map(s=>{ const m=marks[s.id]; return `<div class="stu${m?' mark':''}${m&&m.s==='其他'?' isother':''}" data-id="${esc(s.id)}" data-g="${esc(s.g)}" data-name="${esc(s.name)}">
      <div class="line"><div class="nm">${esc(s.name)}<small>${esc(s.id)}</small></div>
      <select aria-label="${esc(s.name)} 狀況"><option value="">✓ 正常</option>${STATUSES.map(t=>`<option${m&&m.s===t?' selected':''}>${t}</option>`).join("")}</select></div>
      <input class="other" type="text" placeholder="請輸入「其他」狀況" value="${m&&m.s==='其他'?esc(m.note||''):''}">
    </div>`; }).join("")}
  </details>`).join("");
  updateCounts();
}
function updateCounts(){
  document.querySelectorAll("#stuBox .grp").forEach(d=>{
    const n=d.querySelectorAll(".stu.mark").length, c=d.querySelector(".cnt");
    c.textContent = n ? `${n} 人有狀況` : "全員正常"; c.classList.toggle("has",n>0);
  });
}
$("#stuBox").addEventListener("change",e=>{
  if(e.target.tagName!=="SELECT") return;
  const row=e.target.closest(".stu"), v=e.target.value;
  row.classList.toggle("mark",!!v); row.classList.toggle("isother",v==="其他");
  if(v==="其他") row.querySelector("input.other").focus();
  updateCounts();
});
function collectStudents(){
  if(sel.grade!==ROSTER_GRADE) return {list:[]};
  const list=[];
  for(const row of document.querySelectorAll("#stuBox .stu")){
    const v=row.querySelector("select").value; if(!v) continue;
    const it={g:row.dataset.g,id:row.dataset.id,name:row.dataset.name,s:v};
    if(v==="其他"){ it.note=row.querySelector("input.other").value.trim(); if(!it.note) return {err:`請填寫 ${it.name} 的「其他」狀況`,row}; }
    list.push(it);
  }
  return {list};
}
function stuText(arr,sep){ return (arr||[]).map(x=>`${x.g}組 ${x.name}：${x.s==="其他"?(x.note||"其他"):x.s}`).join(sep); }
function resetForm(){
  editingId=null; document.body.classList.remove("editing");
  $("#fDate").value=todayStr(); $("#fProg").value=""; $("#fPerf").value="";
  $("#saveBtn").textContent="💾 儲存記錄"; $("#cancelEdit").style.display="none";
  renderGrades(); renderSubjects(); renderStudents();
}
$("#saveBtn").addEventListener("click",()=>{
  const date=$("#fDate").value, progress=$("#fProg").value.trim(), perf=$("#fPerf").value.trim();
  if(!date) return toast("請選擇日期");
  if(!sel.grade) return toast("請選擇年級");
  if(!sel.subject) return toast("請選擇科目");
  if(!progress) { $("#fProg").focus(); return toast("請填寫進度"); }
  const st=collectStudents();
  if(st.err){ st.row.querySelector("input.other").focus(); return toast(st.err); }
  const students=st.list;
  if(editingId){
    const r=records.find(x=>x.id===editingId);
    Object.assign(r,{date,grade:sel.grade,subject:sel.subject,progress,performance:perf,students,updated:Date.now()});
    save(); toast("✅ 已更新"); resetForm(); go("pg-list"); return;
  }
  records.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    date,grade:sel.grade,subject:sel.subject,progress,performance:perf,students,created:Date.now()});
  save(); toast("✅ 已儲存");
  $("#fProg").value=""; $("#fPerf").value=""; renderLast(); renderStudents(); window.scrollTo({top:0,behavior:"smooth"});
});
$("#cancelEdit").addEventListener("click",()=>{ resetForm(); go("pg-list"); });

/* ---- 歷史 ---- */
function filterKeys(){
  const keys=["全部"]; for(const g in SUBJECTS) for(const s of SUBJECTS[g]) keys.push(g+"｜"+s);
  return keys;
}
function renderList(){
  $("#filters").innerHTML = filterKeys().map(k=>`<button class="chip ${filter===k?'on':''}" data-v="${k}">${k.replace("年級","年").replace("｜"," ")}</button>`).join("");
  const rows = sorted(records).filter(r=> filter==="全部" || (r.grade+"｜"+r.subject)===filter);
  $("#countLbl").textContent = `共 ${rows.length} 筆`;
  $("#list").innerHTML = rows.length ? rows.map(r=>`
    <div class="rec" data-g="${GNUM[r.grade]||0}">
      <div class="top"><span class="date">${fmtDate(r.date)}</span><span class="tag">${esc(r.grade)}・${esc(r.subject)}</span></div>
      <div class="k">進度</div><div class="v">${esc(r.progress)}</div>
      ${r.performance?`<div class="k">課堂表現</div><div class="v">${esc(r.performance)}</div>`:""}
      ${r.students&&r.students.length?`<div class="k">學生狀況（${r.students.length} 人）</div><div class="v">${esc(stuText(r.students,"\n"))}</div>`:""}
      <div class="acts"><button data-act="edit" data-id="${r.id}">✏️ 修改</button><button class="del" data-act="del" data-id="${r.id}">🗑 刪除</button></div>
    </div>`).join("") : `<div class="empty">還沒有記錄<br>到「記錄」頁新增第一筆吧</div>`;
}
$("#filters").addEventListener("click",e=>{ const b=e.target.closest(".chip"); if(!b) return; filter=b.dataset.v; renderList(); });
$("#list").addEventListener("click",e=>{
  const b=e.target.closest("button[data-act]"); if(!b) return;
  const r=records.find(x=>x.id===b.dataset.id); if(!r) return;
  if(b.dataset.act==="del"){
    if(confirm(`確定刪除 ${fmtDate(r.date)} ${r.grade}${r.subject} 這筆記錄？`)){
      records=records.filter(x=>x.id!==r.id); save(); renderList(); toast("已刪除"); }
  } else {
    editingId=r.id; sel={grade:r.grade,subject:r.subject};
    $("#fDate").value=r.date; $("#fProg").value=r.progress; $("#fPerf").value=r.performance||"";
    document.body.classList.add("editing"); $("#saveBtn").textContent="💾 更新這筆記錄";
    $("#cancelEdit").style.display="block"; renderGrades(); renderSubjects(); renderStudents(r.students); go("pg-add");
  }
});

/* ---- 匯出 / 備份 ---- */
function download(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); }
$("#exportXlsx").addEventListener("click",()=>{
  if(!records.length) return toast("目前沒有資料");
  if(typeof XLSX==="undefined") return toast("Excel 模組載入中，請稍候再試");
  const wb=XLSX.utils.book_new();
  const all=[...records].sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created);
  const H=["日期","年級","科目","進度","課堂表現","學生狀況"];
  const toRows = arr => arr.map(r=>({"日期":r.date,"年級":r.grade,"科目":r.subject,"進度":r.progress,"課堂表現":r.performance||"","學生狀況":stuText(r.students,"；")}));
  const addSheet=(name,arr)=>{ const ws=XLSX.utils.json_to_sheet(toRows(arr),{header:H});
    ws["!cols"]=[{wch:12},{wch:8},{wch:12},{wch:40},{wch:40},{wch:50}]; XLSX.utils.book_append_sheet(wb,ws,name); };
  addSheet("全部",all);
  for(const g in SUBJECTS) for(const s of SUBJECTS[g]){
    const arr=all.filter(r=>r.grade===g&&r.subject===s); if(arr.length) addSheet((g.replace("年級","年")+s).slice(0,31),arr);
  }
  // 學生狀況明細與統計
  const det=[]; const cnt={};
  for(const r of all) for(const x of (r.students||[])){
    det.push({"日期":r.date,"科目":r.subject,"組別":x.g,"班級座號":x.id,"姓名":x.name,"狀況":x.s,"說明":x.note||""});
    const c=cnt[x.id]||(cnt[x.id]={"組別":x.g,"班級座號":x.id,"姓名":x.name}); c[x.s]=(c[x.s]||0)+1; c["合計"]=(c["合計"]||0)+1;
  }
  if(det.length){
    const ws=XLSX.utils.json_to_sheet(det,{header:["日期","科目","組別","班級座號","姓名","狀況","說明"]});
    ws["!cols"]=[{wch:12},{wch:10},{wch:6},{wch:10},{wch:10},{wch:12},{wch:30}]; XLSX.utils.book_append_sheet(wb,ws,"學生狀況明細");
    const base=[...roster]; for(const id in cnt) if(!base.some(s=>s.id===id)) base.push({g:cnt[id]["組別"],id,name:cnt[id]["姓名"]});
    const rows=base.sort((a,b)=>a.g.localeCompare(b.g)||a.id.localeCompare(b.id)).map(s=>{ const c=cnt[s.id]||{}; const o={"組別":s.g,"班級座號":s.id,"姓名":s.name}; for(const t of STATUSES) o[t]=c[t]||0; o["合計"]=c["合計"]||0; return o; });
    const ws2=XLSX.utils.json_to_sheet(rows,{header:["組別","班級座號","姓名",...STATUSES,"合計"]});
    ws2["!cols"]=[{wch:6},{wch:10},{wch:10},...STATUSES.map(()=>({wch:10})),{wch:8}]; XLSX.utils.book_append_sheet(wb,ws2,"學生狀況統計");
  }
  const name=`教學進度記錄_${todayStr()}.xlsx`;
  const blob=new Blob([XLSX.write(wb,{bookType:"xlsx",type:"array"})],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  shareOrDownload(blob,name,"📊 已匯出");
});
async function shareOrDownload(blob,name,msg){
  try{
    const file=new File([blob],name,{type:blob.type});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:name}); toast(msg); return true;
    }
  }catch(err){ if(err && err.name==="AbortError") return false; }
  download(blob,name); toast(msg); return true;
}
$("#backupBtn").addEventListener("click",async ()=>{
  if(!records.length) return toast("目前沒有資料");
  const ok=await shareOrDownload(new Blob([JSON.stringify({app:"teaching-log",version:1,exported:new Date().toISOString(),records,roster},null,2)],{type:"application/json"}),`教學進度備份_${todayStr()}.json`,"⬇️ 已備份");
  if(ok){ localStorage.setItem(KEY+".lastBackup",Date.now()); renderStats(); }
});
$("#restoreBtn").addEventListener("click",()=>$("#restoreFile").click());
$("#restoreFile").addEventListener("change",async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const data=JSON.parse(await f.text()); const inc=Array.isArray(data)?data:data.records;
    if(!Array.isArray(inc)) throw 0;
    const ids=new Set(records.map(r=>r.id)); let n=0;
    for(const r of inc){ if(r&&r.id&&r.date&&!ids.has(r.id)){ records.push(r); n++; } }
    let rmsg="";
    if(Array.isArray(data.roster)&&data.roster.length){ roster=data.roster; saveRoster(); renderRoster(); renderStudents(); rmsg=`，名單 ${roster.length} 人`; }
    save(); renderStats(); toast(`已還原 ${n} 筆${rmsg}（重複的略過）`);
  }catch(err){ toast("檔案格式不正確"); }
  e.target.value="";
});
$("#wipeBtn").addEventListener("click",()=>{
  if(!records.length) return toast("目前沒有資料");
  if(confirm("確定清除全部記錄？建議先備份。此動作無法復原。") && confirm("再確認一次：真的要全部刪除？")){
    records=[]; save(); renderStats(); toast("已清除");
  }
});
function renderStats(){
  const lines=[`總記錄：<b>${records.length}</b> 筆`];
  for(const g in SUBJECTS) for(const s of SUBJECTS[g]){
    const arr=records.filter(r=>r.grade===g&&r.subject===s);
    if(arr.length){ const last=arr.reduce((a,b)=>a.date>b.date?a:b); lines.push(`${g}・${s}：${arr.length} 筆（最近 ${last.date.slice(5).replace("-","/")}）`); }
  }
  $("#stats").innerHTML=lines.join("<br>");
  const lb=+localStorage.getItem(KEY+".lastBackup")||0, days=Math.floor((Date.now()-lb)/864e5);
  const rb=$("#backupRemind");
  if(records.length>=5 && (!lb || days>=30)){ rb.textContent = lb ? `⚠️ 已經 ${days} 天沒有備份了，建議按下方「備份」` : "⚠️ 尚未備份過，建議按下方「備份」存一份"; rb.style.display="block"; }
  else rb.style.display="none";
}

/* ---- 導覽 ---- */
function go(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("on",p.id===id));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.pg===id));
  if(id==="pg-list") renderList(); if(id==="pg-data") renderStats();
  window.scrollTo(0,0);
}
document.querySelector("nav").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return;
  if(editingId && b.dataset.pg!=="pg-add") resetForm();
  go(b.dataset.pg); });

let shownToday=todayStr();
function checkDay(){
  const t=todayStr(); if(t===shownToday) return;
  if(!editingId && $("#fDate").value===shownToday) $("#fDate").value=t;
  shownToday=t; $("#todayLbl").textContent=fmtDate(t);
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) checkDay(); });
window.addEventListener("focus",checkDay);
$("#todayLbl").textContent=fmtDate(shownToday);
resetForm();
/* ---- 分組名單管理 ---- */
function renderRoster(){
  const gs=groupsOf(roster);
  $("#rosterInfo").innerHTML = roster.length
    ? `目前名單：<b style="color:var(--text)">${roster.length} 人</b>（${gs.map(x=>`${esc(x.g)} 組 ${x.list.length} 人`).join("、")}）<br>名單只存在這台裝置，不會上傳到網路。`
    : "尚未匯入。格式：組別,班級座號,姓名（可直接匯入 CSV 檔，或從 LINE／記事本複製貼上）。<br>名單只存在這台裝置，不會上傳到網路。";
  $("#rosterClear").style.display = roster.length ? "block" : "none";
}
function applyRoster(text){
  const list=parseRoster(text);
  if(!list.length) return toast("讀不到名單，請確認格式");
  const ids=new Set(); for(const s of list){ if(ids.has(s.id)) return toast(`座號 ${s.id} 重複`); ids.add(s.id); }
  if(roster.length && !confirm(`以新名單（${list.length} 人）取代目前名單（${roster.length} 人）？\n已存的記錄不受影響。`)) return;
  roster=list; saveRoster(); renderRoster(); renderStudents(); toast(`✅ 已匯入 ${list.length} 位學生`);
  $("#rosterText").style.display="none"; $("#rosterPasteRow").style.display="none"; $("#rosterText").value="";
}
$("#rosterFileBtn").addEventListener("click",()=>$("#rosterFile").click());
$("#rosterFile").addEventListener("change",async e=>{
  const f=e.target.files[0]; if(!f) return;
  let buf=await f.arrayBuffer(), text=new TextDecoder("utf-8").decode(buf);
  if(text.includes("\uFFFD")){ try{ text=new TextDecoder("big5").decode(buf); }catch(err){} }
  applyRoster(text); e.target.value="";
});
$("#rosterPasteBtn").addEventListener("click",()=>{
  const t=$("#rosterText"), show=t.style.display!=="block";
  t.style.display=show?"block":"none"; $("#rosterPasteRow").style.display=show?"flex":"none"; if(show) t.focus();
});
$("#rosterPasteOk").addEventListener("click",()=>applyRoster($("#rosterText").value));
$("#rosterClear").addEventListener("click",()=>{
  if(confirm("確定清除分組名單？已存的記錄不受影響。")){ roster=[]; saveRoster(); renderRoster(); renderStudents(); toast("已清除名單"); }
});
renderRoster();

/* ---- 安裝引導 ---- */
(function(){
  const ua=navigator.userAgent, HIDE=KEY+".installHide";
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  if(standalone||localStorage.getItem(HIDE)) return;
  const box=$("#installBox"), T=$("#instT"), D=$("#instD"), go=$("#instGo");
  const isIOS=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const isAndroid=/Android/.test(ua);
  const inApp=/Line\/|FBAN|FBAV|Instagram|GSA\/|; wv\)|MicroMessenger/.test(ua);
  const show=(t,d)=>{T.textContent=t;D.innerHTML=d;box.style.display="block";};
  if(inApp){
    show("⚠️ 目前不是在瀏覽器中開啟", isIOS
      ? "這個視窗無法安裝。請點右上角「⋯」或分享鍵，選<b>「用 Safari 開啟」</b>，再依提示加入主畫面。"
      : "這個視窗無法安裝。請點右上角「⋮」，選<b>「在 Chrome 中開啟」</b>，再依提示安裝。");
  } else if(isIOS){
    if(/CriOS|FxiOS|EdgiOS/.test(ua)) show("請改用 Safari 開啟","iPad／iPhone 只有 <b>Safari</b> 能把 App 加到主畫面。請複製網址到 Safari 開啟。");
    else show("📲 加到主畫面","點網址列旁的<b>分享鍵 ⬆️</b>，往下找<b>「加入主畫面」</b>，再按「新增」。");
  } else if(isAndroid){
    show("📲 安裝到主畫面","點右上角 <b>⋮</b> 選單，選<b>「加到主畫面」</b>→<b>「安裝」</b>。");
  }
  window.addEventListener("beforeinstallprompt",e=>{
    e.preventDefault(); window._bip=e;
    show("📲 安裝到主畫面","按下方按鈕，即可把 App 安裝到主畫面，之後不用網路也能開。");
    go.style.display="block";
  });
  go.addEventListener("click",async()=>{ const e=window._bip; if(!e) return; e.prompt(); const r=await e.userChoice; if(r.outcome==="accepted") box.style.display="none"; window._bip=null; });
  window.addEventListener("appinstalled",()=>{ box.style.display="none"; toast("✅ 已安裝到主畫面"); });
  $("#instNo").addEventListener("click",()=>{ localStorage.setItem(HIDE,"1"); box.style.display="none"; });
})();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();
</script>
